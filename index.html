  <div id="app">  
    <h1 class="logo">LA CANCHA!</h1>  
    <p class="subtitulo">Você consegue acertar o estádio?</p>
    <p id="contador" class="contador"></p>  

    <div id="estadio">  
      <div id="imagem"></div>  
    </div>  

    <div class="entrada">  
      <div class="input-wrapper">
        <input id="resposta" placeholder="Qual é o estádio?" autocomplete="off">
        <ul id="lista-sugestoes" class="sugestoes oculto"></ul>
      </div>
      <button id="confirmar" onclick="verificar()">Confirmar</button>  
    </div>  

    <div id="progress-dots" class="progress-dots">  
      <span class="dot">⚽</span>
      <span class="dot">⚽</span>
      <span class="dot">⚽</span>
      <span class="dot">⚽</span>
      <span class="dot">⚽</span>

    <div id="dicas"></div>

    <div class="ads-container main-ad">
      <p>Publicidade</p>
    </div>
  </div>  

  <div id="resultado" class="resultado oculto">  
    <div class="conteudo-modal">
      <h2 id="mensagemFinal"></h2>  
      <p id="estatistica"></p>  

      <div class="resultado-estadio">
        <img id="resultadoImagem" src="" alt="Estádio do dia">
        <p id="resultadoNome"></p>
      </div>

      <div class="ads-container modal-ad">
        <p>Publicidade</p>
      </div>

      <p id="contadorFinal" class="contador"></p>  
      
      <div class="share">
